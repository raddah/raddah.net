name: Deploy Test Branch

on:
  push:
    branches: [Test]
  pull_request:
    branches: [Test]

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    name: Build & Deploy Test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://raddah.net

      - name: Deploy to Cloudflare Pages (Test)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: raddah-net
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: test-preview
